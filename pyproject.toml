[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-input-publisher"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = ["Jinja2==3.1.6", "markdown-it-py==4.2.0", "Pillow==12.3.0"]

[project.optional-dependencies]
email-setup = ["google-auth-oauthlib>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
